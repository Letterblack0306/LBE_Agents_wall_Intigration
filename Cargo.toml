[package]
name = "lbe-terminal"
version = "0.1.0"
edition = "2024"
description = "LetterBlack Engine terminal CLI/TUI prototype"

[[bin]]
name = "lbe"
path = "src/main.rs"

[dependencies]
ratatui = { version = "0.30.2", default-features = false, features = ["termina"] }
termina = "0.3.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
