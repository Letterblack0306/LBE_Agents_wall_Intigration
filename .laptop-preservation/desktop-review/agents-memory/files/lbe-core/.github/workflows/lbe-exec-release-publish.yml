name: LBE Exec Release Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "@letterblack/lbe-exec correction version, e.g. 1.3.42"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish-exec:
    name: Protected publish for @letterblack/lbe-exec
    runs-on: ubuntu-latest
    environment: npm-publish

    defaults:
      run:
        working-directory: LBE_Core_Engine

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: LBE_Core_Engine/package-lock.json

      - name: Validate requested version format
        run: |
          node -e "const v='${{ inputs.version }}'; if (!/^[0-9]+\.[0-9]+\.[0-9]+$/.test(v)) { console.error('Invalid semver:', v); process.exit(1); }"

      - name: Install dependencies
        run: npm ci

      - name: Install Rust WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Stop if exec correction tag already exists
        run: |
          git fetch --tags
          if git rev-parse "lbe-exec-v${{ inputs.version }}" >/dev/null 2>&1; then
            echo "FAIL: tag lbe-exec-v${{ inputs.version }} already exists"
            exit 1
          fi

      - name: Stop if npm exec version already exists
        run: |
          if npm view "@letterblack/lbe-exec@${{ inputs.version }}" version >/dev/null 2>&1; then
            echo "FAIL: @letterblack/lbe-exec@${{ inputs.version }} already exists on npm"
            exit 1
          fi

      - name: Build engine
        run: npm run build:engine

      - name: Build public exec package
        env:
          LBE_EXEC_PACKAGE_VERSION: ${{ inputs.version }}
        run: npm run build:public-exec

      - name: Verify generated exec package
        run: node scripts/check-public-exec.mjs

      - name: Verify generated exec package version equals input
        run: |
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('release-exec/package.json','utf8')); if (p.name !== '@letterblack/lbe-exec') { console.error('Wrong package:', p.name); process.exit(1); } if (p.version !== '${{ inputs.version }}') { console.error('Version mismatch:', p.version, 'expected', '${{ inputs.version }}'); process.exit(1); } if (p.bin['lbe-exec'] !== 'dist/cli.js') { console.error('Bad bin target'); process.exit(1); } console.log(p.name + '@' + p.version);"

      - name: Generated exec CLI syntax check
        run: node --check release-exec/dist/cli.js

      - name: npm pack dry-run
        run: |
          cd release-exec
          npm pack --dry-run --json

      - name: Create package tarball
        run: |
          cd release-exec
          npm pack
          ls -la *.tgz

      - name: Fresh install smoke before publish
        run: |
          SMOKE_DIR="$(mktemp -d)"
          TARBALL="$(pwd)/release-exec/letterblack-lbe-exec-${{ inputs.version }}.tgz"

          cd "$SMOKE_DIR"
          npm init -y
          npm install "$TARBALL"

          npx lbe-exec --help
          npx lbe-exec status
          npx lbe-exec init
          npx lbe-exec policy

          node --input-type=module -e "import('@letterblack/lbe-exec').then(m => { if (typeof m.createLocalExecutor !== 'function') { throw new Error('createLocalExecutor export missing') } console.log('createLocalExecutor export OK') })"

          echo "Smoke directory: $SMOKE_DIR"

      - name: Publish @letterblack/lbe-exec
        run: |
          cd release-exec
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify npm registry
        run: |
          npm view "@letterblack/lbe-exec@${{ inputs.version }}" version

      - name: Tag exec release after npm verification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "lbe-exec-v${{ inputs.version }}"
          git push origin "lbe-exec-v${{ inputs.version }}"
