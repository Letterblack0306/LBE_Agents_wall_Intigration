name: LBE Release Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version already present in package files, e.g. 1.3.40"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Protected publish for @letterblack/lbe-core
    runs-on: ubuntu-latest
    environment: npm-publish

    defaults:
      run:
        working-directory: LBE_Core_Engine

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: LBE_Core_Engine/package-lock.json

      - name: Validate requested version format
        run: |
          node -e "const v='${{ inputs.version }}'; if (!/^[0-9]+\.[0-9]+\.[0-9]+$/.test(v)) { console.error('Invalid semver:', v); process.exit(1); }"

      - name: Install dependencies
        run: npm ci

      - name: Install Rust WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Stop if git tag already exists
        run: |
          git fetch --tags
          if git rev-parse "v${{ inputs.version }}" >/dev/null 2>&1; then
            echo "FAIL: tag v${{ inputs.version }} already exists"
            exit 1
          fi

      - name: Stop if npm version already exists
        run: |
          if npm view "@letterblack/lbe-core@${{ inputs.version }}" version >/dev/null 2>&1; then
            echo "FAIL: @letterblack/lbe-core@${{ inputs.version }} already exists on npm"
            exit 1
          fi

      - name: Release hygiene gate
        run: npm run release:check

      - name: Build engine
        run: npm run build:engine

      - name: Build public SDK
        run: npm run build:public-sdk

      - name: Verify generated package version equals input
        run: |
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('release-public/package.json','utf8')); if (p.name !== '@letterblack/lbe-core') { console.error('Wrong package:', p.name); process.exit(1); } if (p.version !== '${{ inputs.version }}') { console.error('Version mismatch:', p.version, 'expected', '${{ inputs.version }}'); process.exit(1); } console.log(p.name + '@' + p.version);"

      - name: Generated CLI syntax check
        run: node --check release-public/dist/cli.js

      - name: Public artifact check
        run: node scripts/check-public-artifact.mjs

      - name: Forbidden public string scan
        run: |
          set +e
          grep -RIn "@letterblack/lbe-exec|lbe-exec|release-exec|Used in production|After Effects|all governance decisions|automatic rollback|persistent replay" release-public --include="*.md" --include="*.json" --include="*.ts" --include="*.js"
          EXIT_CODE=$?
          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "FAIL: forbidden public strings found"
            exit 1
          fi
          if [ "$EXIT_CODE" -eq 1 ]; then
            echo "PASS: no forbidden public strings found"
            exit 0
          fi
          echo "FAIL: grep error $EXIT_CODE"
          exit 1

      - name: npm pack dry-run
        run: |
          cd release-public
          npm pack --dry-run --json

      - name: Create package tarball
        run: |
          cd release-public
          npm pack
          ls -la *.tgz

      - name: Fresh install smoke before publish
        run: |
          SMOKE_DIR="$(mktemp -d)"
          TARBALL="$(pwd)/release-public/letterblack-lbe-core-${{ inputs.version }}.tgz"

          cd "$SMOKE_DIR"
          npm init -y
          npm install "$TARBALL"

          npx lbe --version
          npx lbe init
          npx lbe status

          npx lbe proof || true

          echo "Smoke directory: $SMOKE_DIR"

      - name: Publish @letterblack/lbe-core
        run: |
          cd release-public
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify npm registry
        run: |
          npm view "@letterblack/lbe-core@${{ inputs.version }}" version

      - name: Tag release after npm verification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"
