<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200" role="img" aria-label="LetterBlack LBE banner">
  <!-- Background -->
  <rect width="800" height="200" fill="#0b0c15" rx="6"/>

  <!-- Outer red frame -->
  <rect x="24" y="16" width="170" height="168" rx="4" fill="none" stroke="#ef4b4b" stroke-width="4"/>

  <!-- Inner panel border -->
  <rect x="42" y="40" width="134" height="120" rx="2" fill="#000000" stroke="#e9e9ef" stroke-width="8" stroke-linejoin="round"/>

  <!-- Left bracket -->
  <path d="M92 62 H78 V158 H92"
        fill="none" stroke="#e9e9ef" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Center red bar -->
  <rect x="106" y="58" width="10" height="84" rx="2" fill="#ef4b4b"/>

  <!-- Right bracket -->
  <path d="M128 62 H142 V158 H128"
        fill="none" stroke="#e9e9ef" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Title -->
  <text x="220" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#e9e9ef" letter-spacing="1">
    LetterBlack Sentinel
  </text>

  <!-- Tagline -->
  <text x="220" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#a1a1aa" letter-spacing="0.5">
    Local Execution Governance
  </text>

  <!-- Version badge (version-independent — driven by package.json) -->
  <rect x="220" y="120" width="100" height="22" rx="11" fill="#27272a"/>
  <text x="270" y="135" font-family="monospace" font-size="12" fill="#a1a1aa" text-anchor="middle">
    SDK + CLI
  </text>

  <!-- Divider -->
  <line x1="220" y1="152" x2="760" y2="152" stroke="#27272a" stroke-width="1"/>

  <!-- Status dots -->
  <circle cx="235" cy="172" r="4" fill="#ef4b4b"/>
  <text x="245" y="176" font-family="monospace" font-size="11" fill="#a1a1aa">observe</text>

  <circle cx="310" cy="172" r="4" fill="#52525b"/>
  <text x="320" y="176" font-family="monospace" font-size="11" fill="#52525b">local</text>

  <circle cx="375" cy="172" r="4" fill="#52525b"/>
  <text x="385" y="176" font-family="monospace" font-size="11" fill="#52525b">no proof</text>

  <!-- Badge: Terminal-first -->
  <rect x="530" y="56" height="24" rx="4" fill="#7f1d1d"/>
  <text x="540" y="72" font-family="monospace" font-size="11" fill="#fca5a5">Terminal-first</text>

  <rect x="640" y="56" height="24" rx="4" fill="#166534"/>
  <text x="650" y="72" font-family="monospace" font-size="11" fill="#86efac">SDK + CLI</text>

  <!-- Badge: Scope-aware -->
  <rect x="530" y="86" height="24" rx="4" fill="#1e3a5f"/>
  <text x="540" y="102" font-family="monospace" font-size="11" fill="#93c5fd">Scope-aware proof</text>

  <rect x="660" y="86" height="24" rx="4" fill="#27272a"/>
  <text x="670" y="102" font-family="monospace" font-size="11" fill="#a1a1aa">Local-first</text>
</svg>
