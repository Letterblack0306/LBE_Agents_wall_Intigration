# release-prepare — Build and stage release artifact
# Manual version input. Builds release-public, runs npm pack dry-run,
# fresh install smoke, then creates draft release only.
# No npm publish.
name: release-prepare

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.4.0)"
        required: true
        type: string

env:
  LBE_PUBLIC_PACKAGE_VERSION: ${{ inputs.version }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify version
        run: |
          echo "Preparing release v${{ inputs.version }}"
          node -e "const v = '${{ inputs.version }}'.split('.'); if (v.length !== 3 || v.some(n => isNaN(Number(n)))) { process.exit(1) }"

      - name: Build engine
        run: npm run build:engine

      - name: Build public SDK
        run: npm run build:public-sdk

      - name: Validate generated CLI
        run: node --check release-public/dist/cli.js

      - name: Public artifact check
        run: node scripts/check-public-artifact.mjs

      - name: npm pack dry-run
        run: |
          cd release-public
          npm pack --dry-run --json

      - name: Fresh install smoke
        run: |
          SMOKE_DIR=$(mktemp -d)
          cd "$SMOKE_DIR"
          npm init -y
          npm install ${{ github.workspace }}/release-public
          npx lbe --help
          npx lbe --help --advanced
          npx lbe init --yes
          npx lbe status
          npx lbe audit-workspace --json
          npx lbe proof --public
          echo "SMOKE_PASSED=true" >> $GITHUB_ENV

      - name: Create draft release
        if: env.SMOKE_PASSED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: "v${{ inputs.version }}"
          draft: true
          generate_release_notes: true
          files: |
            release-public/dist/cli.js
            release-public/dist/index.js
