tools:
  - id: project.detect
    description: Detect project type and recommend rule packs
    permission: read-only
    risk: low
    timeout_seconds: 20

  - id: retrieval.search
    description: Search historical CEP projects for ranked evidence
    permission: read-only
    risk: low
    endpoint: http://127.0.0.1:8765/search
    timeout_seconds: 30

  - id: gallery.lookup
    description: Load reusable LBE architecture and repair cards
    permission: read-only
    risk: low

  - id: workspace.read
    description: Read files inside the configured workspace root
    permission: read-only
    risk: low

  - id: workspace.apply
    description: Apply an approved diff inside the workspace root
    permission: write
    risk: high
    enabled_by_default: false

  - id: test.run
    description: Run allowlisted validation commands
    permission: controlled-execution
    risk: medium

  - id: memory.write_verified
    description: Store a repair only after validation passes
    permission: write
    risk: medium
